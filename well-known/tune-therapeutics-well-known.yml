description: >-
  Every RFC 8615 well-known path probed anonymously against the single Tune Therapeutics
  host, tunetx.com. There is no api., docs., developer. or status. subdomain (all fail DNS
  resolution), so tunetx.com is the only host with a surface to probe. Two paths return
  real JSON and were saved verbatim: the RFC 8414 OAuth authorization-server metadata and
  the RFC 9728 OAuth protected-resource metadata, both emitted by the WordPress MCP Adapter
  plugin running on the corporate marketing site. Every other well-known path returns the
  site's WordPress 404 page (HTTP 404, text/html) — a genuine 404, not a soft-404.

