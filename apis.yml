aid: tune-therapeutics
name: Tune Therapeutics
description: 'Tune Therapeutics is a clinical-stage epigenetic editing biotechnology company
  headquartered in Durham, North Carolina with a second site in Seattle, Washington. Founded in
  2021 by Charles Gersbach, Fyodor Urnov and Dan McHugh, the company develops its TEMPO platform
  for tunable epigenome editing — programmable DNA-binding modulation of gene expression that
  does not cut or permanently alter the underlying DNA sequence. Its lead program, TUNE-401, is
  an investigational epigenetic silencing therapy for chronic hepatitis B cleared by New Zealand
  Medsafe for a Phase 1b trial. Tune publishes no product API and operates no developer program;
  the only machine-readable surface it exposes is the WordPress REST API and a pair of
  OAuth-gated Model Context Protocol servers shipped by plugins on its corporate marketing site.'
