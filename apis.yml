apis:
- aid: tune-therapeutics:website-mcp
  name: Tune Therapeutics Website MCP Server
  description: 'Two Model Context Protocol servers exposed from the Tune Therapeutics corporate
    WordPress site via the WordPress MCP Adapter plugin, backed by the WordPress Abilities API.
    Both endpoints are live and answer JSON-RPC over HTTP, and both are protected: an
    unauthenticated tools/list returns HTTP 401 with a spec-conformant WWW-Authenticate Bearer
    challenge pointing at RFC 9728 protected-resource metadata. Discovery metadata (RFC 8414
    authorization-server, RFC 9728 protected-resource) is served anonymously and was captured
    verbatim. This is a content-management-platform surface, not a first-party Tune Therapeutics
    product API — recorded because it is a real, live, agent-reachable endpoint on the company
    domain, not because the company markets it.'
  humanURL: https://tunetx.com/
  baseURL: https://tunetx.com/wp-json/mcp/
